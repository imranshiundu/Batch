openapi: 3.1.0
info:
  title: Batch API
  version: 0.3.0
  description: API surface for Batch commitments, slots, segregated ledger accounts, delivery profiles, bot API keys, and bot market access.
servers:
  - url: /api
security:
  - DemoRole: []
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: OK }
  /developers/api-keys:
    get:
      summary: List developer bot API keys
      responses:
        '200': { description: API keys returned without raw secrets }
    post:
      summary: Create developer bot API key
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: API key created and raw secret returned once }
  /developers/api-keys/{keyId}/revoke:
    post:
      summary: Revoke developer bot API key
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: API key revoked }
  /market/instruments:
    get:
      summary: List batch market instruments
      security:
        - BotKey: [market:read]
      responses:
        '200': { description: Instruments returned }
  /market/instruments/{symbol}:
    get:
      summary: Read a batch market instrument
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Instrument returned }
        '404': { description: Instrument not found }
  /market/instruments/{symbol}/depth:
    get:
      summary: Read batch market depth
      security:
        - BotKey: [market:depth:read]
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Depth returned }
        '404': { description: Instrument not found }
  /market/orders:
    post:
      summary: Submit a market-style batch instruction
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: Accepted for routing }
  /buyer/commitments:
    post:
      summary: Create buyer commitment and database-backed Batch Slot
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Commitment created }
  /profile/delivery:
    get:
      summary: List delivery profiles
      security:
        - BotKey: [delivery:read]
      responses:
        '200': { description: Delivery profiles returned }
    post:
      summary: Create delivery profile
      security:
        - BotKey: [delivery:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Delivery profile created }
  /slots:
    get:
      summary: List owned Batch Slots
      security:
        - BotKey: [slots:read]
      responses:
        '200': { description: Slots returned }
  /slots/listings:
    post:
      summary: List an owned Batch Slot for transfer
      security:
        - BotKey: [slots:listings:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Listing created }
  /slots/listings/{listingId}/purchase:
    post:
      summary: Purchase a listed Batch Slot
      security:
        - BotKey: [slots:listings:purchase]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: listingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Slot purchase recorded internally }
  /slots/orders:
    get:
      summary: List slot buy orders
      security:
        - BotKey: [orders:create]
      responses:
        '200': { description: Slot orders returned }
    post:
      summary: Create slot buy order
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Slot order created }
  /slots/orders/{orderId}/reserve:
    post:
      summary: Reserve a matched slot order
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Slot order reserved }
  /slots/orders/{orderId}/cancel:
    post:
      summary: Cancel an open slot order
      security:
        - BotKey: [orders:cancel]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Order cancelled }
  /slots/transfers/{transferId}/hold:
    post:
      summary: Mark slot transfer payment hold posted
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: transferId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Slot transfer hold posted }
  /slots/transfers/{transferId}/complete:
    post:
      summary: Complete held slot transfer
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: transferId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Slot transfer completed }
  /slots/pnl:
    get:
      summary: Read slot P/L
      security:
        - BotKey: [slots:pnl:read]
      responses:
        '200': { description: P/L returned }
  /operator/batches/{slug}/ledger-accounts:
    get:
      summary: List segregated ledger accounts for a batch
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Ledger accounts returned }
    post:
      summary: Provision default segregated ledger accounts for a batch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Ledger accounts provisioned }
  /operator/batches/{slug}/lock-delivery:
    post:
      summary: Lock delivery and stop normal slot transfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Delivery locked }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
  securitySchemes:
    DemoRole:
      type: apiKey
      in: header
      name: x-batch-demo-role
    BotKey:
      type: apiKey
      in: header
      name: x-batch-bot-key
