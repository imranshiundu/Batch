openapi: 3.1.0
info:
  title: Batch API
  version: 0.4.0
  description: API surface for Batch commitments, slots, segregated ledger accounts, delivery profiles, bot API keys, bot market access, supplier operations, operator controls, and payment webhooks.
servers:
  - url: /api
security:
  - DemoRole: []
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: OK }
  /public/batches:
    get:
      summary: List public batches
      responses:
        '200': { description: Batches returned }
  /public/batches/{slug}:
    get:
      summary: Read public batch details
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { description: Batch returned }
        '404': { description: Batch not found }
  /buyer/dashboard:
    get:
      summary: Buyer dashboard snapshot
      responses:
        '200': { description: Buyer dashboard returned }
  /buyer/commitments:
    get:
      summary: List buyer commitments
      responses:
        '200': { description: Commitments returned }
    post:
      summary: Create buyer commitment and database-backed Batch Slot
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Commitment created }
  /developers/bot-manifest:
    get:
      summary: Read bot access manifest
      responses:
        '200': { description: Manifest returned }
  /developers/api-map:
    get:
      summary: Read grouped API map
      responses:
        '200': { description: API map returned }
  /developers/api-keys:
    get:
      summary: List developer bot API keys
      responses:
        '200': { description: API keys returned without raw secrets }
    post:
      summary: Create developer bot API key
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: API key created and raw secret returned once }
  /developers/api-keys/{keyId}/revoke:
    post:
      summary: Revoke developer bot API key
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: API key revoked }
  /market/instruments:
    get:
      summary: List batch market instruments
      security:
        - BotKey: [market:read]
      responses:
        '200': { description: Instruments returned }
  /market/instruments/{symbol}:
    get:
      summary: Read a batch market instrument
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Instrument returned }
        '404': { description: Instrument not found }
  /market/instruments/{symbol}/depth:
    get:
      summary: Read batch market depth
      security:
        - BotKey: [market:depth:read]
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Depth returned }
        '404': { description: Instrument not found }
  /market/orders:
    post:
      summary: Submit a market-style batch instruction
      description: BUY_COMMITMENT routes into commitment creation. SELL_SLOT is rejected unless routed through owned slot listing routes.
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Buy commitment routed and created }
        '409': { description: Slot sale must use slot listing route }
  /profile/delivery:
    get:
      summary: List delivery profiles
      security:
        - BotKey: [delivery:read]
      responses:
        '200': { description: Delivery profiles returned }
    post:
      summary: Create delivery profile
      security:
        - BotKey: [delivery:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Delivery profile created }
  /slots:
    get:
      summary: List owned Batch Slots
      security:
        - BotKey: [slots:read]
      responses:
        '200': { description: Slots returned }
  /slots/listings:
    post:
      summary: List an owned Batch Slot for transfer
      security:
        - BotKey: [slots:listings:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Listing created }
  /slots/listings/{listingId}/purchase:
    post:
      summary: Purchase a listed Batch Slot
      security:
        - BotKey: [slots:listings:purchase]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: listingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Slot purchase recorded internally }
  /slots/orders:
    get:
      summary: List slot buy orders
      security:
        - BotKey: [orders:create]
      responses:
        '200': { description: Slot orders returned }
    post:
      summary: Create slot buy order
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Slot order created }
  /slots/orders/{orderId}/reserve:
    post:
      summary: Reserve a matched slot order
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Slot order reserved }
  /slots/orders/{orderId}/cancel:
    post:
      summary: Cancel an open slot order
      security:
        - BotKey: [orders:cancel]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Order cancelled }
  /slots/transfers/{transferId}/hold:
    post:
      summary: Mark slot transfer payment hold posted
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: transferId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Slot transfer hold posted }
  /slots/transfers/{transferId}/complete:
    post:
      summary: Complete held slot transfer
      security:
        - BotKey: [orders:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: transferId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Slot transfer completed }
  /slots/pnl:
    get:
      summary: Read slot P/L
      security:
        - BotKey: [slots:pnl:read]
      responses:
        '200': { description: P/L returned }
  /supplier/profile:
    get:
      summary: Read supplier profile
      responses:
        '200': { description: Supplier profile returned }
    patch:
      summary: Request supplier profile update
      responses:
        '200': { description: Supplier profile update accepted }
  /supplier/batches:
    get:
      summary: List supplier batches
      responses:
        '200': { description: Supplier batches returned }
    post:
      summary: Create supplier batch draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Supplier batch draft created }
  /supplier/proofs:
    post:
      summary: Submit supplier milestone proof
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Proof submitted }
  /uploads/proofs:
    post:
      summary: Create pending proof upload record
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Pending upload created }
  /operator/overview:
    get:
      summary: Operator overview
      responses:
        '200': { description: Operator overview returned }
  /operator/escrow:
    get:
      summary: Operator escrow snapshot
      responses:
        '200': { description: Escrow snapshot returned }
  /operator/disputes:
    get:
      summary: List disputes
      responses:
        '200': { description: Disputes returned }
    post:
      summary: Open dispute
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Dispute opened }
  /operator/batches/{slug}/transition:
    post:
      summary: Transition batch status
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { description: Batch transitioned }
  /operator/milestones/{milestoneId}/approve-payout:
    post:
      summary: Approve milestone payout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: milestoneId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Payout approval recorded }
  /operator/commitments/{commitmentId}/refund:
    post:
      summary: Create commitment refund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: commitmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Refund created }
  /operator/batches/{slug}/allocate-deliveries:
    post:
      summary: Allocate batch deliveries
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { description: Deliveries allocated }
  /operator/batches/{slug}/lock-delivery:
    post:
      summary: Lock delivery and stop normal slot transfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { description: Delivery locked }
  /operator/batches/{slug}/ledger-accounts:
    get:
      summary: List segregated ledger accounts for a batch
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { description: Ledger accounts returned }
    post:
      summary: Provision default segregated ledger accounts for a batch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Slug'
      responses:
        '201': { description: Ledger accounts provisioned }
  /operator/batches/{slug}/ledger-postings:
    get:
      summary: List ledger postings or reconciliation view
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [reconcile] }
      responses:
        '200': { description: Ledger postings or reconciliation returned }
    post:
      summary: Post controlled entry to a segregated ledger account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Slug'
      responses:
        '201': { description: Ledger entry posted }
  /payments/webhooks/{provider}:
    post:
      summary: Receive payment provider webhook
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [circle, arc, mock, local] }
      responses:
        '202': { description: Webhook accepted }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    DemoRole:
      type: apiKey
      in: header
      name: x-batch-demo-role
    BotKey:
      type: apiKey
      in: header
      name: x-batch-bot-key
